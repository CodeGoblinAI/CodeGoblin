[package]
name = "codegoblin-native"
version = "0.1.0"
edition = "2021"
description = "CodeGoblin native efficiency layer: ranked memory recall and prompt-injection guard scanning."
license = "MIT"

[lib]
name = "codegoblin_native"
path = "src/lib.rs"

[[bin]]
name = "codegoblin-native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Slice 2: enable to compile the llama.cpp-backed local inference engine.
# This is where the `llama-cpp-2` optional dependency (and its CUDA build
# requirements) get wired in; with the feature off, `serve` runs but reports
# that no inference backend is built.
inference = []

[profile.release]
opt-level = 3
lto = true
