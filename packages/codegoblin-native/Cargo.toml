[package]
name = "codegoblin-native"
version = "0.1.0"
edition = "2021"
description = "CodeGoblin native efficiency layer: ranked memory recall and prompt-injection guard scanning."
license = "MIT"

[lib]
name = "codegoblin_native"
path = "src/lib.rs"

[[bin]]
name = "codegoblin-native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
