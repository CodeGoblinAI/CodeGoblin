<!doctype html>
<html lang="en" style="background-color: #000; color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>CodeGoblin</title>
    <link rel="preload" as="image" href="/codegoblin-logo.png" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v4.svg" />
    <link rel="shortcut icon" href="/favicon-v4.svg" />
    <link rel="apple-touch-icon" href="/codegoblin-logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <style>
      @keyframes codegoblin-boot-pulse {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(1);
        }

        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }
    </style>
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <body
    class="antialiased overscroll-none text-12-regular overflow-hidden"
    style="background-color: #000"
  >
    <noscript>You need to enable JavaScript to run CodeGoblin.</noscript>
    <div id="root" class="flex flex-col h-dvh p-px" style="background-color: #000">
      <div
        aria-label="Loading CodeGoblin"
        style="display: grid; width: 100%; height: 100%; place-items: center; background: #000"
      >
        <div
          style="display: grid; width: 80px; height: 80px; place-items: center; border: 1px solid rgba(154, 219, 53, 0.72); border-radius: 8px; background: #030703; box-shadow: 0 0 0 1px rgba(154, 219, 53, 0.08), 0 0 24px rgba(154, 219, 53, 0.16); animation: codegoblin-boot-pulse 1.5s ease-in-out infinite"
        >
          <img
            src="/codegoblin-logo.png"
            alt=""
            aria-hidden="true"
            style="display: block; width: 56px; height: 56px; object-fit: contain"
          />
        </div>
      </div>
    </div>
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
