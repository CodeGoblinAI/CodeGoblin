name: "CodeGoblin GitHub Action"
description: "Run CodeGoblin in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the CodeGoblin session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of hosted app token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/codegoblin,/cg' with '/opencode,/oc' compatibility aliases."
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to the upstream compatibility endpoint."
    required: false

runs:
  using: "composite"
  steps:
    - name: Get CodeGoblin version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/CodeGoblinAI/CodeGoblin/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 || true)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache CodeGoblin
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.codegoblin/bin
        key: codegoblin-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install CodeGoblin
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../install" --no-modify-path

    - name: Add CodeGoblin to PATH
      shell: bash
      run: echo "$HOME/.codegoblin/bin" >> $GITHUB_PATH

    - name: Run CodeGoblin
      shell: bash
      id: run_codegoblin
      run: codegoblin github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
