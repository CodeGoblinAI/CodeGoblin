name: test

# The suite, the typecheck and the built program on Linux, macOS and Windows. CG-Next was written on Windows,
# so this is where the other two are found out.
#
# While the repository is private these minutes are metered (macOS counts tenfold), so it runs on the
# ship branches, on pull requests and by hand - not on every push to main.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["feat/ship-**"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build this platform's program
        if: always()
        run: bun script/build.ts

      - name: The built program runs on its own
        if: always()
        run: node test/user-pass/pass-binary.mjs

      - name: It installs with npm and starts by name
        if: always()
        run: node test/user-pass/pass-install.mjs
