name: deploy

on:
  push:
    branches:
      - dev
      - production
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: deploy-preflight
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "production" && "${ENABLE_CLOUD_DEPLOY}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping hosted cloud deploy for ${GITHUB_REF_NAME}. Set repo variable CODEGOBLIN_ENABLE_CLOUD_DEPLOY=true after Cloudflare/PlanetScale/Stripe/Honeycomb/Sentry are intentionally configured."
            exit 0
          fi

          missing=()
          for name in CLOUDFLARE_API_TOKEN PLANETSCALE_SERVICE_TOKEN_NAME PLANETSCALE_SERVICE_TOKEN STRIPE_SECRET_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Hosted cloud deploy is enabled but required secrets are missing: ${missing[*]}"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
        env:
          ENABLE_CLOUD_DEPLOY: ${{ vars.CODEGOBLIN_ENABLE_CLOUD_DEPLOY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_NAME: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_NAME }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          STRIPE_SECRET_KEY: ${{ github.ref_name == 'production' && secrets.STRIPE_SECRET_KEY_PROD || secrets.STRIPE_SECRET_KEY_DEV }}

      - if: steps.deploy-preflight.outputs.enabled == 'true'
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - if: steps.deploy-preflight.outputs.enabled == 'true'
        uses: ./.github/actions/setup-bun

      - if: steps.deploy-preflight.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - if: steps.deploy-preflight.outputs.enabled == 'true'
        run: bun sst deploy --stage=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_NAME: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_NAME }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          STRIPE_SECRET_KEY: ${{ github.ref_name == 'production' && secrets.STRIPE_SECRET_KEY_PROD || secrets.STRIPE_SECRET_KEY_DEV }}
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: web@${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: web@${{ github.sha }}
