name: publish-codegoblin-npm

# Publishes CodeGoblin to npm: the five per-platform programs, then the package people install by name.
#
# The file name and the repository are what npm trusts (Trusted Publishing, set on each package at npmjs.com):
# rename either and publishing stops working. There is no npm token anywhere.
#
# It only ever runs by hand, and packs without publishing unless "dry_run" is switched off.
#   next    a preview: `npm install -g @codegoblin-io/codegoblin@next`. Nobody gets it unasked.
#   latest  what `npm install -g @codegoblin-io/codegoblin` and `codegoblin upgrade` give everyone.
# To take a release back: npm dist-tag add @codegoblin-io/codegoblin@<the previous version> latest
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.4.0 or 0.4.0-next.1 (default: package.json's)"
        required: false
        type: string
      tag:
        description: "next = preview, latest = everyone"
        required: true
        type: choice
        options: [next, latest]
        default: next
      dry_run:
        description: "Pack and check everything, publish nothing"
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-codegoblin-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One machine builds all five programs (Bun cross-compiles), so every platform is the same commit, the same
  # version and the same model catalogue.
  build:
    if: github.repository == 'CodeGoblinAI/CodeGoblin' || github.repository == 'shawnisikli/CG-Next'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"

      - name: Work out the version
        id: version
        shell: bash
        env:
          ASKED: ${{ inputs.version }}
          TAG: ${{ inputs.tag || 'next' }}
        run: |
          in_repo="$(bun -e 'console.log(require("./package.json").version)')"
          version="${ASKED:-$in_repo}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a version: $version"; exit 1
          fi
          # The number in package.json is the one the source reports; a release must not disagree with it.
          if [ "${version%%-*}" != "${in_repo%%-*}" ]; then
            echo "::error::package.json says $in_repo. Change it to ${version%%-*} in a commit first, then publish."; exit 1
          fi
          if [ "$TAG" = "latest" ] && [[ "$version" == *-* ]]; then
            echo "::error::$version is a preview. Publish it as next, or publish ${version%%-*} as latest."; exit 1
          fi
          # 0.3 installs itself any newer 0.3.x without asking. This codebase must never arrive that way.
          if [[ "$version" == 0.3.* ]]; then
            echo "::error::0.3.x belongs to the old codebase, whose installs update to it automatically."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version as $TAG"

      - run: bun install --frozen-lockfile

      - name: Typecheck and tests
        run: |
          bun run typecheck
          bun run test

      - name: Build every platform
        run: bun script/build.ts --all --require-catalog --version "${{ steps.version.outputs.version }}"

      - name: All five programs and the installer are there
        shell: bash
        run: |
          for name in codegoblin-windows-x64 codegoblin-windows-arm64 codegoblin-linux-x64 codegoblin-linux-arm64 codegoblin-darwin-arm64 codegoblin; do
            test -f "dist/$name/package.json" || { echo "::error::dist/$name was not built"; exit 1; }
          done
          ls -la dist/*/bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codegoblin-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The very files that will be published, started on the system they are for: the program on its own, then
  # installed with npm and started by name.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codegoblin-dist
          path: dist

      # Artifacts do not keep the "this is a program" mark.
      - name: Mark the programs as programs
        if: runner.os != 'Windows'
        run: chmod +x dist/*/bin/*

      - name: The program runs on its own
        run: node test/user-pass/pass-binary.mjs

      - name: It installs with npm and starts by name
        run: node test/user-pass/pass-install.mjs

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets npm see which repository and workflow this is. It is the whole credential.
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codegoblin-dist
          path: dist

      - name: Mark the programs as programs
        run: chmod +x dist/*/bin/*

      # Trusted Publishing needs npm 11.5.1 or later, newer than the one that comes with Node.
      - name: A recent npm
        run: npm install -g npm@11

      - name: Pack or publish
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ inputs.tag || 'next' }}
          # A real publish takes all three: started by hand, "dry_run" switched off, and the repository npm trusts.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.repository == 'CodeGoblinAI/CodeGoblin' && 'false' || 'true' }}
        run: |
          # The programs first: the installer names them at this exact version, so they must exist before it does.
          for dir in codegoblin-windows-x64 codegoblin-windows-arm64 codegoblin-linux-x64 codegoblin-linux-arm64 codegoblin-darwin-arm64 codegoblin; do
            name="$(node -p "require('./dist/$dir/package.json').name")"
            built="$(node -p "require('./dist/$dir/package.json').version")"
            if [ "$built" != "$VERSION" ]; then echo "::error::$name was built as $built, not $VERSION"; exit 1; fi
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published - left as it is"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              (cd "dist/$dir" && npm publish --access public --tag "$TAG" --dry-run)
            else
              (cd "dist/$dir" && npm publish --access public --tag "$TAG")
            fi
          done
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing was published. $VERSION would have gone out as \"$TAG\"."
          else
            echo "Published $VERSION as \"$TAG\"."
            npm view @codegoblin-io/codegoblin dist-tags
          fi
