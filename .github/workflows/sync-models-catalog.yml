name: sync-models-catalog

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'shawnisikli/CodeGoblin' || github.repository == 'codegoblin/codegoblin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Sync models catalog snapshot
        run: bun ./packages/codegoblin/script/sync-models-catalog.ts

      - name: Commit updated catalog when changed
        run: |
          if git diff --quiet packages/codegoblin/models/api.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/codegoblin/models/api.json
          git commit -m "chore(codegoblin): refresh models catalog snapshot"
          git push
