<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CodeGoblin</title>
<link rel="icon" type="image/png" href="/logo.png" />
<style>
  :root {
    /* CodeGoblin charcoal theme, taken from the app theme definition so both
       surfaces look like the same product. Neutral greys; green is reserved
       for identity and active state, gold for accents. */
    --step1: #141414; --step2: #1a1a1a; --step3: #232323; --step5: #323232; --step7: #4c4c4c;
    --step11: #a0a0a0; --step12: #ececec;
    /* The sidebar sits a shade behind the page, as in the desktop app. */
    --side: color-mix(in srgb, var(--step1) 62%, #000);
    /* The reading column: the thread and the composer share it, centred. */
    --col: 800px;
    --bg: var(--step1); --panel: var(--step2); --panel2: var(--step3);
    --line: var(--step5); --line-strong: var(--step7);
    --text: var(--step12); --muted: var(--step11);
    --goblin: #62f56e; --goblin-bright: #92ff9b; --gold: #d4b06a;
    --red: #ff6f7d; --orange: #ffb84d;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /* The panes scroll inside themselves; the page itself never does. Without
     this the session list grew the document past the viewport and pushed the
     composer off the bottom of the screen once enough sessions had piled up. */
  body { margin: 0; height: 100vh; overflow: hidden; display: flex; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

  body.light { --side: color-mix(in srgb, var(--step1) 95%, #000); }
  aside { width: 240px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--side); }
  .brand { display: flex; align-items: center; gap: 9px; padding: 11px 10px 9px 12px; font-weight: 600; color: var(--text); letter-spacing: .1px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; display: block; }
  .brand span { flex: 1; min-width: 0; }
  .group { padding: 14px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); opacity: .8; }
  /* A selected row is a filled pill, not a coloured edge. */
  .row { margin: 1px 6px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: var(--panel2); color: var(--text); }
  .row.active { color: var(--text); background: var(--panel2); }
  #session-list { flex: 1; min-height: 0; overflow-y: auto; }
  aside footer { margin-top: auto; display: flex; gap: 4px; padding: 8px 10px; border-top: 1px solid var(--line); color: var(--muted); }
  .icon svg { display: block; }
  .icon.square { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .shot.textfile { width: auto; min-width: 64px; max-width: 180px; padding: 6px 22px 6px 8px; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  dialog.file-view { width: min(1000px, 92vw); }
  dialog .file-text { max-height: 70vh; overflow: auto; font-family: var(--mono, ui-monospace, monospace); font-size: 12px; line-height: 1.45; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre; }
  dialog input.quick-open { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; font: inherit; margin-bottom: 8px; }
  dialog .dialog-action.active { background: var(--panel2); color: var(--text); }
  body.no-animations *, body.no-animations *::before, body.no-animations *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .worked { margin-top: -8px; font-size: 11.5px; color: var(--muted); opacity: .75; }
  #terminal-panel { height: 34vh; min-height: 160px; border-top: 1px solid var(--line-strong); display: flex; flex-direction: column; background: #0b0e0c; }
  #terminal-panel[hidden] { display: none; }
  #terminal-panel .term-bar { display: flex; align-items: center; gap: 10px; padding: 4px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  #terminal-panel .term-title { color: var(--text); }
  #terminal-panel .term-cwd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #terminal-view { flex: 1; min-height: 0; padding: 4px 0 0 8px; }
  .thread { flex: 1; overflow-y: auto; padding: 24px max(26px, calc((100% - var(--col)) / 2)); display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .empty-hint { margin: auto; text-align: center; color: var(--muted); }
  .empty-hint h1 { margin: 0; font-size: 23px; font-weight: 500; color: var(--text); }

  /* Nothing sent yet: the question and the composer sit together, high in the
     page, instead of a heading floating over an empty thread with the box at
     the bottom of the window. */
  body.home .thread { flex: 0 0 auto; overflow: visible; margin-top: 16vh; padding-block: 0 18px; }
  body.home .composer { --col: 640px; padding-top: 0; }
  body.home .box { min-height: 96px; }
  body.home #usage-readout { visibility: hidden; }

  .turn { display: flex; flex-direction: column; gap: 3px; }
  /* Who said it shows in where it sits: yours on the right, in a bubble. The
     time is here for /timestamps. */
  .turn .who { display: none; font-size: 10.5px; color: var(--muted); opacity: .7; }
  body.show-times .turn .who { display: block; }
  .turn.user { align-items: flex-end; }
  body.fold-answers .turn.agent:not(.unfolded) .body { max-height: 4.6em; overflow: hidden; cursor: pointer;
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent); }
  .turn.flash .body { outline: 1px solid var(--gold); outline-offset: 4px; border-radius: 4px; transition: outline-color 1s; }
  .turn .body { min-width: 0; max-width: 100%; line-height: 1.65; overflow-wrap: anywhere; }
  .turn.user .body { max-width: 80%; background: var(--panel2); border-radius: 12px; padding: 8px 13px; white-space: pre-wrap; }
  .body p { margin: 0 0 9px; } .body p:last-child { margin-bottom: 0; }
  .body h3, .body h4 { margin: 12px 0 6px; font-size: 14px; }
  .body ul { margin: 6px 0; padding-left: 20px; } .body li { margin: 3px 0; }
  code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 12.5px; }
  pre.code { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; overflow-x: auto; margin: 9px 0; }
  pre.code code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.5; }
  /* A wide table scrolls inside its own box. Letting it widen the thread
     instead would push the composer sideways and scroll the whole column. */
  .tablewrap { overflow-x: auto; margin: 10px 0; }
  .body table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  /* The thread breaks anywhere so a long path cannot widen it, but inside a
     table that split "typecheck" across two lines. Cells wrap between words
     and the table scrolls sideways instead. */
  .body th, .body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; overflow-wrap: normal; word-break: normal; }
  .body th { background: var(--panel); font-weight: 600; white-space: nowrap; color: var(--text); }
  .body tbody tr:nth-child(even) td { background: rgba(255, 255, 255, .02); }

  .tool { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; font-family: var(--mono); }
  .tool .tname { color: var(--text); }
  .tool .targs { opacity: .65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .tdenied { color: var(--red); white-space: nowrap; }
  .tool.done .spin { color: var(--goblin); } .tool.failed .spin { color: var(--red); }
  .tool.running .spin { width: 9px; height: 9px; border: 1.5px solid var(--line); border-top-color: var(--goblin); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .composer { padding: 6px max(20px, calc((100% - var(--col) - 12px) / 2)) 12px; }
  /* Attachments sit above the box. Inside it, a thumbnail row would grow the
     box downward and move the caret out from under the cursor mid-sentence. */
  .attached { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 9px; }
  .shot { position: relative; width: 54px; height: 54px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot button { position: absolute; top: 2px; right: 2px; width: 17px; height: 17px; line-height: 15px; padding: 0; border: 0; border-radius: 50%; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; cursor: pointer; }
  .shot.bad { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--red); text-align: center; padding: 4px; }
  .attach { width: 28px; height: 28px; flex-shrink: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 19px; line-height: 1; cursor: pointer; }
  .attach:hover { color: var(--goblin); background: var(--panel2); }
  .attach[disabled] { opacity: .35; cursor: not-allowed; }
  .attach[disabled]:hover { color: var(--muted); background: none; }
  /* The message on top; what it is sent with - mode, model, send - on a row
     underneath, inside the same box. */
  .box { display: flex; flex-direction: column; justify-content: space-between; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 9px 8px 13px; transition: border-color .15s; }
  .box:focus-within { border-color: var(--goblin); }
  .box textarea { flex: none; width: 100%; min-width: 0; min-height: 32px; max-height: 156px; resize: none; overflow-y: auto; margin: 0; padding: 5px 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; line-height: 1.5; }
  .box-row { display: flex; align-items: center; gap: 6px; min-width: 0; margin-left: -5px; }
  .box-row .grow { flex: 1; min-width: 0; }
  .box-row .picker { min-width: 0; }
  .box-row .picker-btn { background: none; border-color: transparent; color: var(--muted); padding: 4px 7px; max-width: 100%; }
  .box-row .picker-btn:hover, .box-row .picker-btn[aria-expanded="true"] { background: var(--panel2); border-color: transparent; color: var(--text); }
  .box-row .picker-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .send { width: 30px; height: 30px; border: 0; border-radius: 999px; background: var(--goblin); color: #06210a; font-size: 15px; cursor: pointer; flex-shrink: 0; }
  .send:disabled { opacity: .3; cursor: default; }
  .stop { border: 1px solid var(--line); background: var(--panel2); color: var(--muted); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 7px 4px 0; font-size: 11px; color: var(--muted); }
  .composer-hint { font-size: 11px; color: var(--muted); opacity: .75; }
  select { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; font: inherit; font-size: 12px; }

  section.activity { width: 290px; flex-shrink: 0; border-left: 1px solid var(--line); padding: 15px 16px; overflow-y: auto; }
  .pill { display: inline-block; font-size: 11px; color: var(--gold); border: 1px solid #3a3320; border-radius: 999px; padding: 2px 10px; }

  .thinking { border-left: 2px solid var(--line); padding-left: 13px; color: var(--muted); font-size: 12.5px; }
  .thinking .tlabel { font-family: var(--mono); font-size: 11px; opacity: .6; margin-bottom: 3px; }
  .thinking .tbody { white-space: pre-wrap; opacity: .75; line-height: 1.5; max-height: 8.5em; overflow-y: auto; }
  body.hide-thinking .thinking { display: none; }

  /* Scrollbars in the theme rather than the browser default white. */
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  *::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Model picker. A native select cannot be themed, and looked it. */
  .picker { position: relative; display: inline-block; }
  .picker-btn { display: flex; align-items: center; gap: 7px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .picker-btn:hover { border-color: var(--line-strong); }
  .picker-btn .picker-caret { color: var(--muted); font-size: 10px; }
  .picker-menu { position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 240px; max-height: 320px;
    overflow-y: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 30; padding: 4px; }
  .picker-item { padding: 7px 11px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted);
    white-space: nowrap; }
  .picker-item:hover, .picker-item.active { background: var(--panel2); color: var(--text); }
  .picker-item.chosen { color: var(--goblin); }
  /* Still selectable - /connect is how you fix it - but it should not read as
     ready. Dimmed, with the reason on the row rather than in a prompt you
     only see after sending one. */
  .picker-item.unready { opacity: .55; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .picker-item.unready:hover, .picker-item.unready.active { opacity: 1; }
  .picker-item .picker-hint { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #mode-btn.full { border-color: var(--gold); color: var(--gold); }
  .plan-tag { font-size: 12px; color: var(--gold); border: 1px solid var(--gold); border-radius: 6px; padding: 2px 8px; }
  .plan-box { background: var(--panel); border: 1px solid var(--gold); border-radius: 8px; padding: 11px 13px; display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .plan-box .ptext { flex: 1; }
  .picker-tag { font-size: 11px; color: var(--gold); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; flex-shrink: 0; }
  /* The star sits before the name; the "no key" tag keeps to the right. */
  .picker-item.unready { justify-content: flex-start; }
  .picker-item.unready .picker-tag { margin-left: auto; }
  .picker-star { background: none; border: 0; padding: 0 6px 0 0; margin: 0; cursor: pointer; font-size: 13px; line-height: 1;
    color: var(--muted); opacity: .45; }
  .picker-star:hover { opacity: 1; color: var(--gold); }
  .picker-star.on { color: var(--gold); opacity: 1; }
  .picker-section { padding: 8px 11px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); opacity: .65; }

  .media { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .media img { max-width: min(420px, 100%); border-radius: 10px; border: 1px solid var(--line); display: block; }
  .media audio { width: min(420px, 100%); }
  .media-caption { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-decoration: none; }
  .media-caption:hover { color: var(--goblin); text-decoration: underline; }

  /* sidebar rows */
  button.row { display: block; width: calc(100% - 12px); text-align: left; background: none; border: 0; font: inherit; }
  #project-name .branch { color: var(--goblin); margin-left: 6px; font-size: 12px; }
  #project-panel { margin: 2px 10px 8px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); font-size: 12.5px; max-height: 55vh; overflow-y: auto; }
  #project-panel .pp-head { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); opacity: .7; margin: 8px 2px 4px; }
  #project-panel .pp-head:first-child { margin-top: 0; }
  #project-panel .pp-item { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 6px; border-radius: 5px; background: none; border: 0; color: var(--muted); font: inherit; text-align: left; cursor: pointer; }
  #project-panel .pp-item:hover { background: var(--panel2); color: var(--text); }
  #project-panel .pp-item.current { color: var(--goblin); cursor: default; }
  #project-panel .pp-item .pp-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #project-panel .pp-item .pp-note { font-size: 11px; opacity: .7; }
  #project-panel .pp-remove { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 13px; }
  #project-panel .pp-remove:hover { color: var(--red, #e06c75); }
  #project-panel form { display: flex; gap: 6px; margin-top: 4px; }
  #project-panel input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; font: inherit; }
  #project-panel form button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #project-panel .pp-message { margin-top: 6px; color: var(--gold); }
  .row.session { display: flex; align-items: center; gap: 8px; }
  .row.session .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.row, .row.session .label { background: none; border: 0; font: inherit; text-align: left; color: inherit; cursor: pointer; }
  .row.session .label { padding: 0; }
  .row.session .when { font-size: 11px; opacity: .55; flex-shrink: 0; }
  .row.session .actions { display: none; gap: 2px; flex-shrink: 0; }
  .row.session:hover .actions, .row.session:focus-within .actions { display: flex; }
  .row.session:hover .when, .row.session:focus-within .when { display: none; }
  .icon { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 13px; line-height: 1; }
  .icon:hover { background: var(--panel2); color: var(--text); }
  .icon.danger:hover { color: var(--red); }
  .row.muted { cursor: default; opacity: .5; }
  .row.muted:hover { background: none; color: var(--muted); }
  #session-list .group { padding: 12px 16px 5px; }

  .question { flex-direction: column; align-items: stretch; gap: 10px; }
  .question .qlabel { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-right: 6px; }
  .question .qoptions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .question .qcheck { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .question .qown { display: flex; gap: 8px; }
  .question .qown input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  .permission { background: var(--panel); border: 1px solid var(--gold); border-radius: 8px; padding: 11px 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: 13px; }
  .permission .ptext { flex: 1 1 230px; min-width: 0; overflow-wrap: anywhere; }
  .permission strong { color: var(--gold); }
  .permission .pkey { background: var(--bg); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 9px; font: inherit; font-family: var(--mono); font-size: 12px; min-width: 240px; }
  .permission .pdetail { display: block; color: var(--muted); font-family: var(--mono); font-size: 11.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .permission .pcover { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .pactions { display: flex; flex-wrap: wrap; gap: 7px; max-width: 100%; overflow-wrap: anywhere; }
  .permission .pkey { min-width: 0; width: min(240px, 100%); }
  .pallow, .pdeny { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .pallow:hover { border-color: var(--goblin); color: var(--goblin); }
  .pdeny:hover { border-color: var(--red); color: var(--red); }
  .presolved { color: var(--muted); font-size: 12px; }

  .composer { position: relative; }
  /* A quarter of the window, scrolling: with every skill listed it used to cover the page and could not scroll. */
  .palette { position: absolute; bottom: calc(100% + 6px); left: max(20px, calc((100% - var(--col) - 12px) / 2)); right: max(20px, calc((100% - var(--col) - 12px) / 2)); max-height: 28vh; overflow-y: auto; overscroll-behavior: contain; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 20; }
  .psection { position: sticky; top: 0; padding: 5px 13px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1; }
  .prow { display: flex; gap: 14px; padding: 8px 13px; cursor: pointer; font-size: 13px; }
  .prow .pvalue { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
  .prow .phint { color: var(--muted); opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow:hover { background: var(--panel2); }
  .prow.active { background: var(--panel2); }
  .prow.active .pvalue { color: var(--goblin); }
  .prow.active .phint { color: var(--text); opacity: 1; }
  .tool.note { border-color: var(--line); }
  pre.typed-output { margin: 4px 0 0; padding: 8px 11px; max-height: 320px; overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.45; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool.note .tname { color: var(--muted); font-family: var(--font); }
  .send.stopping { background: linear-gradient(#ff8f9b, #cc5566); color: #2a0508; }
  .send.stopping:hover { filter: brightness(1.1); }

  .act-head { margin-bottom: 14px; }
  .act-section { margin-bottom: 16px; }
  .act-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .act-count { color: var(--goblin); letter-spacing: 0; }
  #review-diff { background: none; border: 1px solid var(--line); border-radius: 4px; color: var(--goblin); cursor: pointer; font: inherit; margin-bottom: 8px; padding: 4px 8px; }
  .act-row { display: flex; gap: 8px; font-size: 12.5px; padding: 4px 0; color: var(--muted); align-items: baseline; }
  .act-row .mark { flex-shrink: 0; width: 12px; }
  .act-row .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
  .act-row.done .mark { color: var(--goblin); }
  .act-row.failed .mark { color: var(--red); }
  .act-row.active { color: var(--text); }
  .act-row.active .mark { color: var(--goblin); }
  .act-empty { color: var(--muted); font-size: 12.5px; }
  .pill.busy { color: var(--goblin); border-color: #2c4a1e; }
</style>

<aside aria-label="Conversations">
  <div class="brand"><img src="/logo.png" alt="" /><span>CodeGoblin</span><button class="icon square" id="new-session" type="button" title="New session" aria-label="New session"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></div>
  <div id="session-list"></div>
  <div class="group">Project</div>
  <button class="row muted" id="project-name" type="button" aria-expanded="false" aria-controls="project-panel" title="Switch project, branch or worktree">Local workspace</button>
  <div id="project-panel" hidden></div>
  <footer><button id="settings-open" class="icon square" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button><button id="help-open" class="icon square" type="button" title="Help" aria-label="Help"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.3"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.4"/><circle cx="8" cy="11.4" r=".4" fill="currentColor"/></svg></button></footer>
</aside>

<main>
  <nav class="layout-controls"><button id="sessions-toggle" class="icon square" type="button" aria-expanded="true" title="Show or hide conversations" aria-label="Sessions"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button><span id="session-title"></span><span id="session-loading" role="status" hidden>Loading conversation…</span><span id="usage-readout">Usage unavailable until a response</span><button id="activity-toggle" class="icon square" type="button" aria-expanded="false" title="Show or hide activity and changes" aria-label="Activity"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg></button></nav>
  <div class="thread" id="thread"></div>
  <section id="terminal-panel" aria-label="Terminal" hidden>
    <div class="term-bar"><span class="term-title">Terminal</span><span class="term-cwd"></span><button type="button" class="icon" id="terminal-close" title="Close the terminal (Ctrl+`)">Close</button></div>
    <div id="terminal-view"></div>
  </section>
  <div class="composer">
    <!-- What is attached, before it is sent. Above the box rather than inside
         it: a thumbnail row that grew the box would move the caret. -->
    <div class="attached" id="attached" hidden></div>
    <div class="box">
      <input type="file" id="picker" multiple hidden />
      <textarea id="input" rows="1" aria-label="Message or slash command" aria-describedby="composer-hint" placeholder="Ask the goblin…  / for commands, @ for context" autocomplete="off" spellcheck="false"></textarea>
      <div class="box-row">
        <button class="attach" id="attach" type="button" title="Add to the prompt" aria-label="Add to the prompt">+</button>
        <div class="picker" id="mode">
          <button class="picker-btn" id="mode-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="mode-menu" title="How much to ask before acting">
            <span class="picker-label">Ask for approval</span><span class="picker-caret">▾</span>
          </button>
          <div class="picker-menu" id="mode-menu" role="listbox" aria-label="Approval mode" tabindex="-1" hidden></div>
        </div>
        <span class="plan-tag" id="plan-tag" hidden>planning</span>
        <span class="plan-tag" id="boost-tag" hidden>boost</span>
        <span class="grow"></span>
        <div class="picker" id="provider">
          <button class="picker-btn" id="provider-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="provider-menu">
            <span class="picker-label">…</span><span class="picker-caret">▾</span>
          </button>
          <div class="picker-menu" id="provider-menu" role="listbox" aria-label="Models" tabindex="-1" hidden></div>
        </div>
        <button class="stop" id="stop" hidden>Stop</button>
        <button class="send" id="send" title="Send" aria-label="Send">↑</button>
      </div>
    </div>
    <div class="meta">
      <span class="composer-hint" id="composer-hint">Enter to send · Shift+Enter for a new line</span>
      <span id="hint"></span>
    </div>
  </div>
</main>

<section class="activity" aria-label="Activity">
  <div class="act-head"><span class="pill" id="act-state">Idle</span> <button id="review-diff" type="button">Review diff</button></div>
  <div class="act-section" id="act-plan" hidden>
    <div class="act-label">Plan <span class="act-count" id="plan-count"></span></div>
    <div id="plan-list"></div>
  </div>
  <div class="act-section" id="act-running" hidden>
    <div class="act-label">Running</div>
    <div id="running-list"></div>
  </div>
  <div class="act-section" id="act-feed" hidden>
    <div class="act-label">Activity</div>
    <div id="feed-list"></div>
  </div>
  <div class="act-section" id="act-changes" hidden>
    <div class="act-label">Changes <span class="act-count" id="changes-count"></span></div>
    <div id="changes-list"></div>
  </div>
  <p class="act-empty" id="act-empty">Nothing running yet.</p>
</section>

<style>
  .layout-controls { padding: 7px 10px; display: flex; align-items: center; gap: 10px; min-height: 43px; }
  #session-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13.5px; }
  #session-loading { font-size: 12px; color: var(--muted); }
  #session-title { flex: 0 1 auto; }
  #usage-readout { flex: 0 20 auto; margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--muted); }
  /* Above the fold the menus have no room to open upward, so they drop. */
  @media(min-width: 651px) {
    #provider .picker-menu { left: auto; right: 0; }
    body.home .picker-menu { bottom: auto; top: calc(100% + 6px); }
    body.home .palette { bottom: auto; top: 100%; max-height: 42vh; }
  }
  body.hide-sessions > aside, body.hide-activity > .activity { display: none; }
  #panel-backdrop { position: fixed; inset: var(--layout-header-height, 45px) 0 0; z-index: 20; background: #0008; border: 0; }
  :focus-visible { outline: 2px solid var(--goblin); outline-offset: 2px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); border-radius: 12px; width: min(560px, 92vw); max-height: 80vh; overflow: auto; }
  dialog::backdrop { background: #0009; }
  dialog h2 { margin-top: 0; font-size: 18px; }
  dialog label { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 16px 0; }
  dialog button, dialog select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  dialog .dialog-action { display: block; width: 100%; text-align: left; margin: 8px 0; }
  dialog input[type="search"] { box-sizing: border-box; width: 100%; margin: 12px 0; padding: 10px; color: var(--text); background: var(--step1); border: 1px solid var(--line); border-radius: 7px; }
  dialog .command-list { max-height: 55vh; overflow-y: auto; }
  dialog .command-row { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 12px; align-items: baseline; }
  dialog .command-row span { color: var(--muted); font-size: 12px; }
  dialog[aria-label="Conversation changes"] { width: min(1000px, 92vw); }
  /* Settings: sections on the left, the chosen section's rows on the right. */
  dialog.settings { width: min(860px, 94vw); height: min(600px, 84vh); padding: 0; overflow: hidden; }
  dialog.settings[open] { display: grid; grid-template-columns: 190px 1fr; }
  .set-nav { background: var(--side); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .set-nav h2 { margin: 0 8px 12px; font-size: 15px; }
  dialog .set-tab { background: none; border: 1px solid transparent; border-radius: 7px; padding: 8px 10px; text-align: left; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
  dialog .set-tab:hover { color: var(--text); background: var(--panel2); }
  dialog .set-tab.active { color: var(--text); background: var(--panel2); border-color: var(--goblin); }
  .set-pane { position: relative; padding: 18px 22px 20px; overflow-y: auto; min-width: 0; }
  .set-pane h3 { margin: 0 0 12px; font-size: 16px; }
  dialog .set-close { position: absolute; top: 12px; right: 14px; border: 0; background: none; font-size: 20px; padding: 2px 8px; color: var(--muted); }
  dialog.settings input[type="search"] { margin: 0 0 12px; }
  .set-rows { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
  dialog label.set-row { margin: 0; padding: 13px 0; border-bottom: 1px solid var(--line); cursor: default; }
  dialog label.set-row:last-child { border-bottom: 0; }
  .set-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .set-title { font-weight: 600; }
  .set-about { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .set-rows > p.set-about { padding: 14px 0; margin: 0; }
  dialog .set-row select, dialog .set-row button { flex-shrink: 0; max-width: 46%; padding: 6px 9px; }
  /* An on/off setting is a switch. */
  input.switch { appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 34px; height: 20px; margin: 0; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s; }
  input.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  input.switch:checked { background: var(--goblin); }
  input.switch:checked::after { transform: translateX(14px); background: #06210a; }
  input.switch:disabled { opacity: .5; }
  @media(max-width: 650px) {
    dialog.settings[open] { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .set-nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; }
    .set-nav h2 { flex-basis: 100%; margin-bottom: 6px; }
    dialog .set-row select, dialog .set-row button { max-width: 55%; }
  }
  dialog .diff-line, dialog .diff-hunk { margin: 0; white-space: pre; overflow-wrap: normal; font: 12px var(--mono); }
  body.diff-wrap dialog .diff-line { white-space: pre-wrap; overflow-wrap: anywhere; }
  dialog details { overflow-x: auto; margin: 16px 0; }
  dialog summary { cursor: pointer; margin-bottom: 8px; }
  dialog .diff-add { color: var(--goblin); }
  dialog .diff-remove { color: var(--red); }
  dialog .diff-hunk { color: var(--muted); margin: 8px 0; }
  @media(max-width: 900px) { body > .activity { width: 210px; } aside { width: 180px; } }
  @media(max-width: 650px) {
    body > .activity, aside { position: fixed; top: var(--layout-header-height, 45px); bottom: 0; z-index: 30; background: var(--panel); max-width: 85vw; }
    body > .activity { right: 0; } aside { left: 0; }
    .meta { flex-wrap: wrap; gap: 8px; }
    .picker, .picker-btn { max-width: 100%; }
    .picker-label { min-width: 0; white-space: normal; overflow-wrap: anywhere; text-align: left; }
    .picker-menu { position: fixed; left: 20px; right: 20px; bottom: var(--picker-bottom, 90px); min-width: 0; max-height: min(320px, 50vh); }
    .picker-item { white-space: normal; overflow-wrap: anywhere; }
    .box textarea { min-width: 0; }
    .thread { padding: 18px 12px; }
    body.home .thread { margin-top: 9vh; }
  }
</style>
