<!doctype html>
<meta charset="utf-8" />
<title>CodeGoblin</title>
<style>
  :root {
    --bg: #0f1113; --panel: #16181c; --line: #24272c;
    --text: #dcdcdc; --muted: #7a7f87; --goblin: #9adb35; --gold: #d4b06a;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: var(--font); }

  /* Left: sessions + projects */
  aside { width: 220px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .brand { padding: 14px 16px; font-weight: 600; letter-spacing: .3px; color: var(--goblin); }
  .group { padding: 14px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: default; }
  .row:hover { background: #1b1e23; color: var(--text); }
  aside footer { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  /* Middle: the conversation */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .empty { flex: 1; display: grid; place-content: center; text-align: center; gap: 10px; }
  .empty h1 { margin: 0; font-size: 22px; font-weight: 500; }
  .empty p { margin: 0; color: var(--muted); font-size: 13px; }
  .composer { border-top: 1px solid var(--line); padding: 14px 18px; }
  .box { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .box:focus-within { border-color: #3a7d3f; }
  .box input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 14px; }
  .send { width: 30px; height: 30px; border: 0; border-radius: 999px; background: linear-gradient(#9adb35, #6fae28); color: #06210a; font-size: 15px; cursor: pointer; }
  .meta { display: flex; gap: 14px; padding: 8px 2px 0; font-size: 12px; color: var(--muted); }

  /* Right: activity */
  section.activity { width: 300px; flex-shrink: 0; border-left: 1px solid var(--line); padding: 14px 16px; }
  .pill { display: inline-block; font-size: 11px; color: var(--gold); border: 1px solid #3a3320; border-radius: 999px; padding: 2px 9px; }
</style>

<aside>
  <div class="brand">CodeGoblin</div>
  <div class="group">Today</div>
  <div class="row">New session</div>
  <div class="group">Project hoard</div>
  <div class="row">cg-next</div>
  <footer>Settings · Help</footer>
</aside>

<main>
  <div class="empty">
    <h1>What should we work on?</h1>
    <p>Nothing is wired yet — this is the shell.</p>
  </div>
  <div class="composer">
    <div class="box">
      <input placeholder="Ask the goblin…  / for commands, @ for context" />
      <button class="send" title="Send">↑</button>
    </div>
    <div class="meta"><span>main</span><span>no model selected</span></div>
  </div>
</main>

<section class="activity">
  <span class="pill">Activity</span>
  <p style="color:var(--muted);font-size:13px">Tool calls and diffs will appear here.</p>
</section>
