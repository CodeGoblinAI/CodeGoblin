<!doctype html>
<meta charset="utf-8" />
<title>CodeGoblin</title>
<style>
  :root {
    /* CodeGoblin charcoal theme, taken from the app theme definition so both
       surfaces look like the same product. Neutral greys; green is reserved
       for identity and active state, gold for accents. */
    --step1: #16181c; --step2: #1a1d22; --step3: #22262c; --step5: #333842; --step7: #4b515d;
    --step11: #9aa1ab; --step12: #e8eaed;
    --bg: var(--step1); --panel: var(--step2); --panel2: var(--step3);
    --line: var(--step5); --line-strong: var(--step7);
    --text: var(--step12); --muted: var(--step11);
    --goblin: #62f56e; --goblin-bright: #92ff9b; --gold: #d4b06a;
    --red: #ff6f7d; --orange: #ffb84d;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /* The panes scroll inside themselves; the page itself never does. Without
     this the session list grew the document past the viewport and pushed the
     composer off the bottom of the screen once enough sessions had piled up. */
  body { margin: 0; height: 100vh; overflow: hidden; display: flex; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

  aside { width: 230px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .brand { padding: 15px 16px; font-weight: 600; color: var(--goblin); letter-spacing: .2px; }
  .group { padding: 14px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
  .row:hover { background: var(--panel2); color: var(--text); }
  .row.active { color: var(--text); border-left-color: var(--goblin); background: var(--panel); }
  #new-session { color: var(--goblin); }
  #session-list { flex: 1; min-height: 0; overflow-y: auto; }
  aside footer { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .thread { flex: 1; overflow-y: auto; padding: 24px 26px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .empty-hint { margin: auto; text-align: center; color: var(--muted); }
  .empty-hint h1 { margin: 0 0 6px; font-size: 21px; font-weight: 500; color: var(--text); }
  .empty-hint p { margin: 0; font-size: 13px; }

  .turn { display: flex; gap: 12px; }
  .turn .who { width: 56px; flex-shrink: 0; font-size: 12px; color: var(--muted); padding-top: 2px; }
  .turn .body { flex: 1; min-width: 0; line-height: 1.65; border-left: 2px solid transparent; padding-left: 13px; overflow-wrap: anywhere; }
  .turn.user .body { border-left-color: var(--gold); }
  .turn.agent .body { border-left-color: var(--goblin); }
  .body p { margin: 0 0 9px; } .body p:last-child { margin-bottom: 0; }
  .body h3, .body h4 { margin: 12px 0 6px; font-size: 14px; }
  .body ul { margin: 6px 0; padding-left: 20px; } .body li { margin: 3px 0; }
  code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 12.5px; }
  pre.code { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; overflow-x: auto; margin: 9px 0; }
  pre.code code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.5; }

  .tool { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; margin-left: 68px; font-family: var(--mono); }
  .tool .tname { color: var(--text); }
  .tool .targs { opacity: .65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool.done .spin { color: var(--goblin); } .tool.failed .spin { color: var(--red); }
  .tool.running .spin { width: 9px; height: 9px; border: 1.5px solid var(--line); border-top-color: var(--goblin); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .composer { border-top: 1px solid var(--line); padding: 14px 20px 12px; }
  .box { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; transition: border-color .15s; }
  .box:focus-within { border-color: var(--goblin); }
  .box input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .send { width: 30px; height: 30px; border: 0; border-radius: 999px; background: linear-gradient(var(--goblin-bright), var(--goblin)); color: #06210a; font-size: 15px; cursor: pointer; flex-shrink: 0; }
  .send:disabled { opacity: .3; cursor: default; }
  .stop { border: 1px solid var(--line); background: var(--panel2); color: var(--muted); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .meta { display: flex; align-items: center; gap: 12px; padding: 9px 3px 0; font-size: 12px; color: var(--muted); }
  select { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; font: inherit; font-size: 12px; }

  section.activity { width: 290px; flex-shrink: 0; border-left: 1px solid var(--line); padding: 15px 16px; }
  .pill { display: inline-block; font-size: 11px; color: var(--gold); border: 1px solid #3a3320; border-radius: 999px; padding: 2px 10px; }

  .thinking { border-left: 2px solid var(--line); padding-left: 13px; margin-left: 41px; color: var(--muted); font-size: 12.5px; }
  .thinking .tlabel { font-family: var(--mono); font-size: 11px; opacity: .6; margin-bottom: 3px; }
  .thinking .tbody { white-space: pre-wrap; opacity: .75; line-height: 1.5; max-height: 8.5em; overflow-y: auto; }
  body.hide-thinking .thinking { display: none; }

  /* Scrollbars in the theme rather than the browser default white. */
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  *::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Model picker. A native select cannot be themed, and looked it. */
  .picker { position: relative; display: inline-block; }
  .picker-btn { display: flex; align-items: center; gap: 7px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .picker-btn:hover { border-color: var(--line-strong); }
  .picker-btn .picker-caret { color: var(--muted); font-size: 10px; }
  .picker-menu { position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 240px; max-height: 320px;
    overflow-y: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 30; padding: 4px; }
  .picker-item { padding: 7px 11px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted);
    white-space: nowrap; }
  .picker-item:hover { background: var(--panel2); color: var(--text); }
  .picker-item.chosen { color: var(--goblin); }

  /* sidebar rows */
  .row.session { display: flex; align-items: center; gap: 8px; }
  .row.session .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.session .when { font-size: 11px; opacity: .55; flex-shrink: 0; }
  .row.session .actions { display: none; gap: 2px; flex-shrink: 0; }
  .row.session:hover .actions { display: flex; }
  .row.session:hover .when { display: none; }
  .icon { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 13px; line-height: 1; }
  .icon:hover { background: var(--panel2); color: var(--text); }
  .icon.danger:hover { color: var(--red); }
  .row.muted { cursor: default; opacity: .5; }
  .row.muted:hover { background: none; color: var(--muted); }
  #session-list .group { padding: 12px 16px 4px; }

  .permission { margin-left: 68px; background: var(--panel); border: 1px solid var(--gold); border-radius: 8px; padding: 11px 13px; display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .permission .ptext { flex: 1; min-width: 0; }
  .permission strong { color: var(--gold); }
  .permission .pdetail { display: block; color: var(--muted); font-family: var(--mono); font-size: 11.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pactions { display: flex; gap: 7px; flex-shrink: 0; }
  .pallow, .pdeny { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .pallow:hover { border-color: var(--goblin); color: var(--goblin); }
  .pdeny:hover { border-color: var(--red); color: var(--red); }
  .presolved { color: var(--muted); font-size: 12px; }

  .composer { position: relative; }
  .palette { position: absolute; bottom: calc(100% + 6px); left: 20px; right: 20px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 20; }
  .prow { display: flex; gap: 14px; padding: 8px 13px; cursor: pointer; font-size: 13px; }
  .prow .pvalue { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
  .prow .phint { color: var(--muted); opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow:hover { background: var(--panel2); }
  .prow.active { background: var(--panel2); }
  .prow.active .pvalue { color: var(--goblin); }
  .prow.active .phint { color: var(--text); opacity: 1; }
  .tool.note { border-color: var(--line); }
  .tool.note .tname { color: var(--muted); font-family: var(--font); }
  .send.stopping { background: linear-gradient(#ff8f9b, #cc5566); color: #2a0508; }
  .send.stopping:hover { filter: brightness(1.1); }

  .act-head { margin-bottom: 14px; }
  .act-section { margin-bottom: 16px; }
  .act-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .act-count { color: var(--goblin); letter-spacing: 0; }
  .act-row { display: flex; gap: 8px; font-size: 12.5px; padding: 4px 0; color: var(--muted); align-items: baseline; }
  .act-row .mark { flex-shrink: 0; width: 12px; }
  .act-row .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
  .act-row.done .mark { color: var(--goblin); }
  .act-row.failed .mark { color: var(--red); }
  .act-row.active { color: var(--text); }
  .act-row.active .mark { color: var(--goblin); }
  .act-empty { color: var(--muted); font-size: 12.5px; }
  .pill.busy { color: var(--goblin); border-color: #2c4a1e; }
</style>

<aside>
  <div class="brand">CodeGoblin</div>
  <div class="group">Sessions</div>
  <div class="row" id="new-session">+ New session</div>
  <div id="session-list"></div>
  <div class="group">Project</div>
  <div class="row">cg-next</div>
  <footer>Settings · Help</footer>
</aside>

<main>
  <div class="thread" id="thread"></div>
  <div class="composer">
    <div class="box">
      <input id="input" placeholder="Ask the goblin…  / for commands, @ for context" autocomplete="off" />
      <button class="stop" id="stop" hidden>Stop</button>
      <button class="send" id="send" title="Send">↑</button>
    </div>
    <div class="meta">
      <span>main</span>
      <div class="picker" id="provider">
        <button class="picker-btn" id="provider-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="picker-label">…</span><span class="picker-caret">▾</span>
        </button>
        <div class="picker-menu" id="provider-menu" role="listbox" hidden></div>
      </div>
      <span id="hint"></span>
    </div>
  </div>
</main>

<section class="activity">
  <div class="act-head"><span class="pill" id="act-state">Idle</span></div>
  <div class="act-section" id="act-plan" hidden>
    <div class="act-label">Plan <span class="act-count" id="plan-count"></span></div>
    <div id="plan-list"></div>
  </div>
  <div class="act-section" id="act-running" hidden>
    <div class="act-label">Running</div>
    <div id="running-list"></div>
  </div>
  <div class="act-section" id="act-feed" hidden>
    <div class="act-label">Activity</div>
    <div id="feed-list"></div>
  </div>
  <div class="act-section" id="act-changes" hidden>
    <div class="act-label">Changes <span class="act-count" id="changes-count"></span></div>
    <div id="changes-list"></div>
  </div>
  <p class="act-empty" id="act-empty">Nothing running yet.</p>
</section>

<script src="/app.js"></script>
